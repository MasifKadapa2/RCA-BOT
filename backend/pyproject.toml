[project]
name = "rca-bot-backend"
version = "1.0.0"
description = "RCA Bot - local-first AI engineering assistant that investigates Sentry issues from Slack"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "slack-bolt>=1.20",
    "slack-sdk>=3.27",
    "httpx>=0.27",
    "chromadb>=0.6",
    "sentence-transformers>=3.0",
    "tree-sitter>=0.23",
    "tree-sitter-language-pack>=0.4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.24",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = ["ignore::DeprecationWarning"]
